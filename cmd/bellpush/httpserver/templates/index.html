<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>pi-bell</title>
	<style>
		body {
			font-family: Arial;
		}

		h1 {
			text-decoration: underline;
		}

		td {
			padding-right: 0.5em;
		}

		th {
			text-align: left;
		}

		/* video-stream is a custom element (go2rtc's video-rtc.js) with no built-in
		   display rule, so browsers default it to "display: inline" - which causes
		   width/aspect-ratio in its style attribute to be ignored and the element to
		   collapse to the height of its (empty) inline content. Force block layout so
		   the sizing below actually takes effect. */
		video-stream {
			display: block;
		}
	</style>
</head>

<body>
	<h1>{{ .Title }}</h1>
	<h2>Bell</h2>
	<div>
		<button onclick="ringBell()">Ring bell</button>
	</div>

	<h2>Connected Chimes:</h2>
	{{if .Chimes}}
	<table>
		<tr>
			<th>Name</th>
			<th>Snooze</th>
		</tr>
		{{ range .Chimes }}
		<tr>
			<td>{{ .Name }}</td>
			<td>
				{{ if .SnoozeExpiry }}
				Snoozing until {{ .SnoozeExpiry }} <button onclick="unsnooze({{ .Name }})">Cancel snooze</button>
				{{ else }}
				<button onclick="snooze({{ .Name }}, 30)">30m</button>
				<button onclick="snooze({{ .Name }}, 60)">1h</button>
				<button onclick="snooze({{ .Name }}, 90)">1h30</button>
				<button onclick="snooze({{ .Name }}, 120)">2h</button>
				<button onclick="snooze({{ .Name }}, 180)">3h</button>
				<button onclick="snooze({{ .Name }}, 240)">4h</button>
				<button onclick="snooze({{ .Name }}, 360)">6h</button>
				<button onclick="snooze({{ .Name }}, 480)">8h</button>
				{{ end }}
			</td>
		</tr>
		{{ end }}
	</table>
	</ul>
	{{else}}
	<p>No chimes connected</p>
	{{end}}

	<h2>Webcam</h2>
	{{ if .Go2rtcBaseURL }}
	<div>
		<!-- video-rtc.js only exports the VideoRTC class; it never registers a custom
		     element. go2rtc's video-stream.js imports video-rtc.js and is the one that
		     calls customElements.define('video-stream', ...), so it must be loaded here
		     for the <video-stream> tag below to do anything. -->
		<script src="{{ .Go2rtcBaseURL }}/video-stream.js" type="module"></script>
		<video-stream
			id="go2rtc-video"
			style="width: 640px; max-width: 100%; aspect-ratio: 4 / 3; background: #000;">
		</video-stream>
		<script type="module">
			// `src` on <video-stream> is a JS property setter (defined via a `set src`
			// accessor), not a reflected HTML attribute - go2rtc's video-stream.js has no
			// observedAttributes/attributeChangedCallback to bridge the two. Setting
			// src="..." directly in the HTML markup is silently ignored, so it must be
			// assigned as a property here instead for the player to actually connect.
			document.getElementById("go2rtc-video").src = "{{ .Go2rtcBaseURL }}/api/ws?src={{ .Go2rtcStream }}";
		</script>
	</div>
	<div>
		<button onclick="window.open('/camera/latest?' + new Date().getTime(), '_blank')">Open snapshot</button>
	</div>
	{{ else }}
	<div>
		<img id="webcam-image" src="/camera/latest" alt="Webcam image" width="640" height="480">
	</div>
	<div>
		<button onclick="updateWebcam()">Update webcam image</button>
	</div>
	<div>
		<input type="checkbox" id="webcam-autorefresh"> Auto-refresh
	</div>
	{{ end }}

	<script>
		function snooze(chime, duration) {
			console.log("Snoozing " + chime + " for " + duration + " minutes");
			fetch(`/chime/snooze?name=${chime}&duration=${duration}m`, {
				method: "POST"
			}).then(response => {
				if (response.ok) {
					console.log("Snooze request sent");
					window.location.reload();
				} else {
					console.log("Snooze request failed");
					alert("Snooze request failed: " + response.status + " " + response.statusText);
				}
			});
		}
		function unsnooze(chime) {
			console.log("UnSnoozing " + chime);
			fetch(`/chime/unsnooze?name=${chime}`, {
				method: "POST"
			}).then(response => {
				if (response.ok) {
					console.log("UnSnooze request sent");
					window.location.reload();
				} else {
					console.log("UnSnooze request failed");
					alert("UnSnooze request failed: " + response.status + " " + response.statusText);
				}
			});
		}
		function ringBell() {
			console.log("Ringing bell");
			fetch("/button/push-release", {
				method: "POST"
			}).then(response => {
				if (response.ok) {
					console.log("Ring request sent");
				} else {
					console.log("Ring request failed");
					alert("Ring request failed: " + response.status + " " + response.statusText);
				}
			});
		}

		function updateWebcam() {
			console.log("Updating webcam image");
			document.getElementById("webcam-image").src = "/camera/latest?" + new Date().getTime();
		}
		const webcamAutoRefreshElement = document.getElementById("webcam-autorefresh");
		if (webcamAutoRefreshElement) {
			var webcamInterval = null;
			var currentUrl = new URL(window.location);
			webcamAutoRefreshElement.checked = (currentUrl.searchParams.get("autorefresh") ?? "true") === "true";
			webcamAutoRefreshElement.onchange = function () {
				if (this.checked) {
					currentUrl.searchParams.delete("autorefresh");
				} else {
					currentUrl.searchParams.set("autorefresh", "false");
				}
				window.location.assign(currentUrl.toString());
			}
			if (webcamAutoRefreshElement.checked) {
				webcamInterval = setInterval(updateWebcam, 1000);
			}
		}

	</script>

</body>

</html>
